permissions:
  contents: read

name: Build and Package Source ZIP

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g., V3)'
        required: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
    outputs:
      artifact_name: ${{ steps.gen.outputs.artifact_name }}
      release_date: ${{ steps.gen.outputs.release_date }}

    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Generate artifact filename
        id: gen
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "Invalid release version/tag." >&2
            exit 1
          fi
          DATE="$(date -u +%Y%m%d)"
          echo "artifact_name=FileHasher_${VERSION}-${DATE}.zip" >> "$GITHUB_OUTPUT"
          echo "release_date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Create ZIP
        env:
          ARTIFACT_NAME: ${{ steps.gen.outputs.artifact_name }}
        run: zip -r "$ARTIFACT_NAME" . -x ".git/*" ".github/*" "node_modules/*" "dist/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gen.outputs.artifact_name }}
          path: ${{ steps.gen.outputs.artifact_name }}

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | grep -Fvx -- "$VERSION" | head -n 1 || true)"
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="$(git rev-list --max-parents=0 HEAD)"
          fi
          git log "$PREV_TAG..HEAD" --pretty=format:'- %s ([%h](https://github.com/'"$GITHUB_REPOSITORY"'/commit/%H))' > notes.md

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}-${{ needs.package.outputs.release_date }}
          body_path: notes.md
          files: ${{ needs.package.outputs.artifact_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
